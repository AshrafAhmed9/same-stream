name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests (Krippendorff alpha, decomposed-sequence logic, FHIR export)
        run: npx vitest run
      - name: Build
        run: npx vite build

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install krippendorff numpy pandas pytest
      - name: Cross-check Python krippendorff package against the same worked example as the JS implementation
        run: pytest analysis/tests/ -q

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <rect width="400" height="220" fill="#eef2ee"/>
  <text x="200" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#14251f" font-weight="600">A "barrier" can be small</text>
  <!-- streambed -->
  <rect x="0" y="140" width="400" height="80" fill="#c7d6cd"/>
  <!-- water upstream (higher) -->
  <rect x="20" y="110" width="150" height="30" fill="#6fa8c9"/>
  <!-- small weir wall -->
  <rect x="170" y="95" width="18" height="60" fill="#8b8f92" stroke="#5a6165" stroke-width="2"/>
  <!-- water downstream (lower, falling) -->
  <rect x="188" y="150" width="190" height="10" fill="#6fa8c9"/>
  <polygon points="188,150 188,140 190,150" fill="#a9cde3"/>
  <!-- small ripple marks downstream -->
  <path d="M210 158 q10 -5 20 0 q10 5 20 0" stroke="#3f7ea3" stroke-width="1.5" fill="none"/>
  <path d="M250 160 q10 -5 20 0 q10 5 20 0" stroke="#3f7ea3" stroke-width="1.5" fill="none"/>
  <text x="90" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14251f">upstream, calmer</text>
  <text x="290" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14251f">downstream, disturbed</text>
  <text x="179" y="90" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14251f" font-weight="600">small weir /</text>
  <text x="179" y="104" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14251f" font-weight="600">check dam</text>
  <text x="200" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5a6b63">A knee-high concrete step or old ford counts as a barrier —</text>
  <text x="200" y="211" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5a6b63">not just large dams like the app's own example photo shows.</text>
</svg>

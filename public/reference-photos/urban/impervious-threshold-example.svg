<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <rect width="400" height="220" fill="#eef2ee"/>
  <text x="200" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#14251f" font-weight="600">The "more than 1/3" threshold</text>

  <!-- Example A: under a third paved -> No -->
  <g transform="translate(20,45)">
    <rect x="0" y="0" width="160" height="50" fill="#e3e9e2" stroke="#5a6b63"/>
    <rect x="0" y="0" width="45" height="50" fill="#9aa0a3"/>
    <line x1="53" y1="-4" x2="53" y2="54" stroke="#9c3b2c" stroke-dasharray="3,3"/>
    <line x1="107" y1="-4" x2="107" y2="54" stroke="#9c3b2c" stroke-dasharray="3,3"/>
    <text x="80" y="70" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14251f">~28% paved → <tspan font-weight="700">No</tspan></text>
  </g>

  <!-- Example B: about a third -->
  <g transform="translate(220,45)">
    <rect x="0" y="0" width="160" height="50" fill="#e3e9e2" stroke="#5a6b63"/>
    <rect x="0" y="0" width="53" height="50" fill="#9aa0a3"/>
    <line x1="53" y1="-4" x2="53" y2="54" stroke="#9c3b2c" stroke-dasharray="3,3"/>
    <line x1="107" y1="-4" x2="107" y2="54" stroke="#9c3b2c" stroke-dasharray="3,3"/>
    <text x="80" y="70" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14251f">~33% paved → borderline</text>
  </g>

  <!-- Example C: more than a third -->
  <g transform="translate(120,130)">
    <rect x="0" y="0" width="160" height="50" fill="#e3e9e2" stroke="#5a6b63"/>
    <rect x="0" y="0" width="90" height="50" fill="#9aa0a3"/>
    <line x1="53" y1="-4" x2="53" y2="54" stroke="#9c3b2c" stroke-dasharray="3,3"/>
    <line x1="107" y1="-4" x2="107" y2="54" stroke="#9c3b2c" stroke-dasharray="3,3"/>
    <text x="80" y="70" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14251f">~56% paved → <tspan font-weight="700">Yes</tspan></text>
  </g>

  <text x="200" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5a6b63">Grey = road, sidewalk, building footprint within the margin. Dashed lines mark each third.</text>
</svg>

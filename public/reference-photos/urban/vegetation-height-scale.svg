<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220">
  <rect width="480" height="220" fill="#eef2ee"/>
  <text x="240" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#14251f" font-weight="600">Height bands (OneAquaHealth's own protocol)</text>
  <!-- ground line -->
  <line x1="20" y1="190" x2="460" y2="190" stroke="#5a6b63" stroke-width="2"/>
  <!-- person for scale ~1.7m -->
  <g transform="translate(65,0)">
    <circle cx="0" cy="130" r="9" fill="#14251f"/>
    <line x1="0" y1="139" x2="0" y2="175" stroke="#14251f" stroke-width="3"/>
    <line x1="0" y1="150" x2="-10" y2="165" stroke="#14251f" stroke-width="3"/>
    <line x1="0" y1="150" x2="10" y2="165" stroke="#14251f" stroke-width="3"/>
    <line x1="0" y1="175" x2="-7" y2="190" stroke="#14251f" stroke-width="3"/>
    <line x1="0" y1="175" x2="7" y2="190" stroke="#14251f" stroke-width="3"/>
    <text x="0" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5a6b63">person, ~1.7m</text>
  </g>
  <!-- Herbs: <1.5m -->
  <g transform="translate(190,0)">
    <path d="M0 190 Q -6 165 0 150 Q 6 165 0 150" stroke="#3a7d4f" stroke-width="3" fill="none"/>
    <path d="M-8 190 Q -14 170 -8 155" stroke="#3a7d4f" stroke-width="2" fill="none"/>
    <path d="M8 190 Q 14 170 8 155" stroke="#3a7d4f" stroke-width="2" fill="none"/>
    <text x="0" y="205" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14251f" font-weight="600">Herbs</text>
    <text x="0" y="217" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5a6b63">&lt; 1.5m, below waist</text>
  </g>
  <!-- Shrubs: 1.5-3m -->
  <g transform="translate(310,0)">
    <ellipse cx="0" cy="145" rx="26" ry="42" fill="#4a9160"/>
    <text x="0" y="205" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14251f" font-weight="600">Shrubs</text>
    <text x="0" y="217" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5a6b63">1.5–3m, taller than you</text>
  </g>
  <!-- Trees: >3m -->
  <g transform="translate(420,0)">
    <line x1="0" y1="190" x2="0" y2="80" stroke="#6b4a30" stroke-width="6"/>
    <ellipse cx="0" cy="65" rx="34" ry="34" fill="#2f7a46"/>
    <text x="0" y="205" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14251f" font-weight="600">Trees</text>
    <text x="0" y="217" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5a6b63">&gt; 3m</text>
  </g>
</svg>
